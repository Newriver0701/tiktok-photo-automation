<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Carousel Generator</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #f4f1ec;
  color: #171717;
  font-family:
    Inter,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

body {
  padding: 24px;
}

button,
textarea,
select,
input {
  font: inherit;
}

.app {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(360px, 520px) 1fr;
  gap: 24px;
  align-items: start;
}

.panel,
.preview,
.output,
.rendered {
  background: #fffdfa;
  border: 1px solid #ded8cf;
  border-radius: 8px;
}

.panel {
  position: sticky;
  top: 24px;
  padding: 18px;
}

.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

h1 {
  margin: 0;
  font-size: 22px;
  line-height: 1.25;
}

.status {
  min-height: 22px;
  color: #717171;
  font-size: 13px;
}

.status.error {
  color: #b42318;
}

.mode-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.mode-tab {
  min-height: 38px;
  border: 1px solid #cfc7bc;
  border-radius: 6px;
  background: #fffdfa;
  color: #25221d;
  cursor: pointer;
  font-weight: 800;
}

.mode-tab.active {
  border-color: #151515;
  background: #151515;
  color: #fff;
}

.editor {
  display: block;
  width: 100%;
  min-height: 460px;
  padding: 14px;
  border: 1px solid #cfc7bc;
  border-radius: 6px;
  resize: vertical;
  color: #111;
  background: #fff;
  font-family: Consolas, "SFMono-Regular", monospace;
  font-size: 13px;
  line-height: 1.5;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.uploads {
  display: grid;
  gap: 10px;
  margin-top: 14px;
  padding: 12px;
  border: 1px solid #ded8cf;
  border-radius: 8px;
  background: #f8f5ef;
}

.upload-row {
  display: grid;
  gap: 6px;
}

.upload-row label {
  color: #383838;
  font-size: 13px;
  font-weight: 700;
}

.file-input {
  width: 100%;
  min-height: 36px;
  color: #333;
  font-size: 13px;
}

.button {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid #151515;
  border-radius: 6px;
  padding: 8px 12px;
  background: #151515;
  color: #fff;
  cursor: pointer;
}

.button.secondary {
  background: #fffdfa;
  color: #151515;
  border-color: #cfc7bc;
}

.button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.work {
  display: grid;
  gap: 18px;
}

.preview {
  padding: 18px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.toolbar h2 {
  margin: 0;
  font-size: 16px;
}

.select {
  min-height: 36px;
  border: 1px solid #cfc7bc;
  border-radius: 6px;
  background: #fff;
  padding: 6px 10px;
}

.preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}

.mini {
  position: relative;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  border-radius: 8px;
  background: #000;
  container-type: inline-size;
}

.mini .post {
  position: absolute;
  inset: 0;
}

.output {
  padding: 18px;
}

.rendered {
  padding: 18px;
}

.code-output {
  display: block;
  width: 100%;
  min-height: 320px;
  padding: 14px;
  border: 1px solid #cfc7bc;
  border-radius: 6px;
  resize: vertical;
  color: #111;
  background: #fff;
  font-family: Consolas, "SFMono-Regular", monospace;
  font-size: 12px;
  line-height: 1.45;
}

.render-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}

.render-card {
  overflow: hidden;
  border: 1px solid #ded8cf;
  border-radius: 8px;
  background: #fff;
}

.render-card img {
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  background: #111;
}

.render-meta {
  display: grid;
  gap: 8px;
  padding: 10px;
}

.render-title {
  font-size: 13px;
  font-weight: 800;
}

.render-subtitle {
  color: #717171;
  font-size: 12px;
}

.render-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.prompt-box {
  display: block;
  width: 100%;
  min-height: 260px;
  padding: 14px;
  border: 1px solid #cfc7bc;
  border-radius: 6px;
  resize: vertical;
  color: #111;
  background: #fff;
  font-family: Consolas, "SFMono-Regular", monospace;
  font-size: 12px;
  line-height: 1.5;
}

.post {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.bg,
.bg-fallback {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.bg {
  object-fit: cover;
}

.bg-fallback {
  background:
    radial-gradient(circle at 22% 20%, rgba(245, 245, 245, .22), transparent 28%),
    linear-gradient(145deg, #0d1016 0%, #3f4653 48%, #14171d 100%);
}

.overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.22),
      rgba(0,0,0,.07) 45%,
      rgba(0,0,0,.30)
    );
}

.content {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12cqw 5.8cqw 18cqw;
}

.story {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4.5cqw;
}

.bubble {
  width: 100%;
  text-align: center;
  line-height: 1.55;
  padding: 0 1cqw;
}

.bubble-text {
  display: inline;
  background: #fff;
  color: #050505;
  font-size: 5.7cqw;
  font-weight: 900;
  letter-spacing: 0;
  line-height: 1.55;
  padding: 1.6cqw 2.7cqw 1.9cqw;
  border-radius: 2.2cqw;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  box-shadow:
    0 2px 4px rgba(0,0,0,.14),
    0 7px 16px rgba(0,0,0,.08);
  overflow-wrap: anywhere;
}

.bubble-text.em {
  background: #111;
  color: #fff;
}

.post.dense .content {
  padding: 9.5cqw 5.1cqw 13.5cqw;
}

.post.dense .story {
  gap: 2.65cqw;
}

.post.dense .bubble-text {
  font-size: 4.2cqw;
  line-height: 1.48;
  padding: 1.15cqw 2.05cqw 1.4cqw;
  border-radius: 1.65cqw;
}

.kicker,
.counter,
.handle,
.swipe {
  position: absolute;
  z-index: 3;
  color: #fff;
  font-weight: 900;
}

.kicker {
  top: 5.2%;
  left: 5%;
  font-size: 2.5cqw;
}

.counter {
  top: 4.6%;
  right: 5%;
  font-size: 2.9cqw;
}

.handle {
  right: 4.5%;
  bottom: 5.7%;
  color: rgba(255,255,255,.9);
  font-size: 2.3cqw;
  font-weight: 700;
}

.swipe {
  left: 50%;
  bottom: 5.6%;
  transform: translateX(-50%);
  color: rgba(255,255,255,.78);
  font-size: 2cqw;
  font-weight: 700;
}

.company-post {
  color: #111;
  background: #d8e5ec;
}

.company-bg,
.company-bg-fallback {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.company-bg {
  object-fit: cover;
}

.company-bg-fallback {
  background:
    linear-gradient(180deg, rgba(92, 169, 216, .88) 0%, rgba(206, 220, 226, .84) 48%, rgba(158, 166, 168, .86) 100%),
    repeating-linear-gradient(90deg, transparent 0 14cqw, rgba(26, 51, 62, .18) 14cqw 14.35cqw);
}

.company-bg-shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: rgba(255,255,255,.05);
}

.company-small-photo {
  position: absolute;
  z-index: 3;
  left: -1.2cqw;
  top: 3.1%;
  width: 29.5cqw;
  height: 31%;
  object-fit: cover;
  border: .42cqw solid #101010;
  border-left: 0;
  border-radius: 0 3.8cqw 3.8cqw 0;
  box-shadow: 0 1.3cqw 3.5cqw rgba(0,0,0,.24);
}

.company-card {
  position: absolute;
  z-index: 4;
  left: 20.5cqw;
  top: 18.5%;
  width: 69cqw;
  min-height: 61%;
  padding: 7.6cqw 3.6cqw 4.3cqw;
  background: #fff;
  border: .42cqw solid #151515;
  border-radius: 2.2cqw;
  box-shadow: 0 1.6cqw 3.4cqw rgba(0,0,0,.20);
}

.company-logo-box {
  display: grid;
  place-items: center;
  min-height: 10.2cqw;
  margin-bottom: 3.3cqw;
  border: .28cqw solid #151515;
  border-radius: 1cqw;
  padding: 1.5cqw;
  text-align: center;
}

.company-logo-image {
  display: block;
  max-width: 100%;
  max-height: 8.8cqw;
  object-fit: contain;
}

.company-logo {
  font-size: 6.1cqw;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 0;
}

.company-logo-sub {
  margin-top: .8cqw;
  font-size: 1.55cqw;
  line-height: 1.2;
  font-weight: 800;
}

.company-name {
  margin-bottom: 2.4cqw;
  font-size: 3.7cqw;
  line-height: 1.24;
  font-weight: 900;
}

.company-deadline {
  display: inline-flex;
  align-items: center;
  min-height: 6.4cqw;
  margin-bottom: 2.2cqw;
  padding: .8cqw 2.4cqw;
  border-radius: 1.2cqw;
  background: #f0df4d;
  color: #111;
  font-size: 3.55cqw;
  line-height: 1.1;
  font-weight: 900;
}

.company-metrics {
  margin-bottom: .8cqw;
  font-size: 2.25cqw;
  line-height: 1.35;
  font-weight: 900;
}

.company-note {
  margin-bottom: 2.6cqw;
  color: #4d4d4d;
  font-size: 1.65cqw;
  line-height: 1.3;
  font-weight: 800;
}

.company-section-title {
  margin: 2.2cqw 0 1.15cqw;
  padding-bottom: .45cqw;
  border-bottom: .28cqw solid #151515;
  font-size: 2.75cqw;
  line-height: 1.2;
  font-weight: 900;
}

.company-points {
  margin: 0;
  padding-left: 3.1cqw;
}

.company-points li,
.company-fit {
  margin: 0 0 .75cqw;
  font-size: 2.02cqw;
  line-height: 1.38;
  font-weight: 800;
}

.company-fit {
  padding-left: .3cqw;
}

@media (max-width: 900px) {
  body {
    padding: 14px;
  }

  .app {
    grid-template-columns: 1fr;
  }

  .panel {
    position: static;
  }
}
</style>
</head>
<body>
<main class="app">
  <section class="panel" aria-label="JSON input">
    <div class="brand">
      <h1>JSON Carousel Generator</h1>
      <div id="status" class="status">Ready</div>
    </div>
    <div class="mode-tabs" role="tablist" aria-label="Generator mode">
      <button id="normalModeButton" class="mode-tab active" type="button">通常</button>
      <button id="denseModeButton" class="mode-tab" type="button">文章多め</button>
      <button id="companyModeButton" class="mode-tab" type="button">企業カード</button>
    </div>
    <textarea id="jsonInput" class="editor" spellcheck="false" aria-label="Carousel JSON"></textarea>
    <div class="uploads">
      <div class="upload-row">
        <label for="commonBackgroundInput">Common background image</label>
        <input id="commonBackgroundInput" class="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
      <div class="upload-row">
        <label for="slideBackgroundInput">Background for selected slide</label>
        <input id="slideBackgroundInput" class="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
    </div>
    <div class="actions">
      <button id="generateButton" class="button" type="button">Generate</button>
      <button id="downloadZipButton" class="button secondary" type="button" disabled>Download ZIP</button>
      <button id="copyButton" class="button secondary" type="button" disabled>Copy current HTML</button>
      <button id="renderCurrentButton" class="button" type="button" disabled>Render current PNG</button>
      <button id="renderAllButton" class="button secondary" type="button" disabled>Render all PNGs</button>
      <button id="downloadPngZipButton" class="button secondary" type="button" disabled>Download PNG ZIP</button>
    </div>
  </section>

  <section class="work">
    <section class="preview" aria-label="Preview">
      <div class="toolbar">
        <h2>Preview</h2>
        <select id="slideSelect" class="select" aria-label="Current slide"></select>
      </div>
      <div id="previewGrid" class="preview-grid"></div>
    </section>

    <section class="output" aria-label="HTML output">
      <div class="toolbar">
        <h2>Current HTML</h2>
        <button id="downloadCurrentButton" class="button secondary" type="button" disabled>Download current</button>
      </div>
      <textarea id="htmlOutput" class="code-output" spellcheck="false" readonly></textarea>
    </section>

    <section class="output" aria-label="ChatGPT prompt">
      <div class="toolbar">
        <h2>ChatGPT Prompt</h2>
        <button id="copyPromptButton" class="button secondary" type="button">Copy prompt</button>
      </div>
      <textarea id="promptOutput" class="prompt-box" spellcheck="false" readonly></textarea>
    </section>

    <section class="rendered" aria-label="Rendered PNGs">
      <div class="toolbar">
        <h2>Rendered PNGs</h2>
      </div>
      <div id="renderedGrid" class="render-grid"></div>
    </section>
  </section>
</main>

<script>
const normalSampleData = {
  background: "background.jpg",
  slides: [
    {
      swipe: true,

      ]

    {
      blocks: [

      ]
    },
    {
      background: "background-03.jpg",

        { text: "強い答えは、" },
        { text: "きれいな言葉より、具体的な経験から出る。", em: true }

    }
  ]

const denseSampleData = {
  background: "background.jpg",
  mode: "dense",
  slides: [
    {
      swipe: true,
      blocks: [
        { text: "面接で差がつくのは、" },

        { text: "自分の経験から何を学び、\n次にどう活かすかまで話せる人。" },
        { text: "ここが浅いと、どれだけ頑張った話でも\nただの思い出で終わってしまう。" }
      ]
    },

        { text: "大事なのは、なぜ動いたのか、\n何を見て判断したのか、\nどこで失敗したのか。" },

    {

    },
    {
      blocks: [

  background: "company-background.jpg",

};

let currentMode = "normal";
let generatedFiles = [];
let currentIndex = 0;
let commonBackgroundDataUrl = "";
let slideBackgroundDataUrls = [];
let renderedImages = [];

const jsonInput = document.querySelector("#jsonInput");
const statusEl = document.querySelector("#status");
const previewGrid = document.querySelector("#previewGrid");
const htmlOutput = document.querySelector("#htmlOutput");
const slideSelect = document.querySelector("#slideSelect");
const generateButton = document.querySelector("#generateButton");
const downloadZipButton = document.querySelector("#downloadZipButton");
const downloadCurrentButton = document.querySelector("#downloadCurrentButton");
const copyButton = document.querySelector("#copyButton");
const commonBackgroundInput = document.querySelector("#commonBackgroundInput");
const slideBackgroundInput = document.querySelector("#slideBackgroundInput");
const renderCurrentButton = document.querySelector("#renderCurrentButton");
const renderAllButton = document.querySelector("#renderAllButton");
const downloadPngZipButton = document.querySelector("#downloadPngZipButton");
const renderedGrid = document.querySelector("#renderedGrid");
const promptOutput = document.querySelector("#promptOutput");
const copyPromptButton = document.querySelector("#copyPromptButton");
const normalModeButton = document.querySelector("#normalModeButton");
const denseModeButton = document.querySelector("#denseModeButton");
const companyModeButton = document.querySelector("#companyModeButton");

downloadCurrentButton.addEventListener("click", downloadCurrent);

renderAllButton.addEventListener("click", renderAllPngs);

normalModeButton.addEventListener("click", () => applyMode("normal"));
denseModeButton.addEventListener("click", () => applyMode("dense"));
companyModeButton.addEventListener("click", () => applyMode("company"));

slideBackgroundInput.addEventListener("change", handleSlideBackground);
slideSelect.addEventListener("change", () => {
  currentIndex = Number(slideSelect.value);
  slideBackgroundInput.value = "";
  updateCurrentOutput();
});

generate();

function applyMode(mode) {
  currentMode = ["normal", "dense", "company"].includes(mode) ? mode : "normal";
  normalModeButton.classList.toggle("active", currentMode === "normal");
  denseModeButton.classList.toggle("active", currentMode === "dense");
  companyModeButton.classList.toggle("active", currentMode === "company");
  const samples = {
    normal: normalSampleData,
    dense: denseSampleData,
    company: companySampleData
  };
  jsonInput.value = JSON.stringify(samples[currentMode], null, 2);
  promptOutput.value = buildChatGptPrompt(currentMode);
  renderedImages = [];
  generate();
}

function generate() {
  try {
    const rawData = JSON.parse(jsonInput.value);
    const hasCompanySlides = rawData && Array.isArray(rawData.slides) && rawData.slides.some(slide => slide && typeof slide.company === "string");
    const data = rawData && (rawData.mode === "company" || (currentMode === "company" && hasCompanySlides))
      ? normalizeCompanyData(rawData)
      : normalizeData(rawData);
    data.mode = data.mode || currentMode;
    generatedFiles = data.slides.map((slide, index) => {
      const fileName = `slide_${String(index + 1).padStart(2, "0")}.html`;
      return {
        fileName,
        pngName: fileName.replace(/\.html$/, ".png"),
        index,
        html: renderDocument(data, slide, index),
        preview: renderPost(data, slide, index)
      };
    });
    renderedImages = renderedImages.filter(item => generatedFiles[item.index]);
    currentIndex = 0;
    renderPreview();
    renderRenderedImages();
    updateCurrentOutput();
    setStatus(`Generated ${generatedFiles.length} slide(s)`);
    setEnabled(true);
  } catch (error) {
    generatedFiles = [];
    renderedImages = [];
    previewGrid.innerHTML = "";
    renderedGrid.innerHTML = "";
    slideSelect.innerHTML = "";
    htmlOutput.value = "";
    setEnabled(false);
    setStatus(error.message, true);
  }
}

function normalizeStringList(value, fallback = []) {
  if (!Array.isArray(value)) {
    return fallback;
  }
  return value
    .filter(item => typeof item === "string" && item.trim())
    .map(item => item.trim());
}

function normalizeCompanyData(data) {
  if (!data || typeof data !== "object") {
    throw new Error("JSON root must be an object.");
  }

  if (!Array.isArray(data.slides) || data.slides.length === 0) {
    throw new Error("slides must be a non-empty array.");
  }

  return {
    mode: "company",
    background: typeof data.background === "string" ? data.background : "",
    backgroundPosition: typeof data.backgroundPosition === "string" ? data.backgroundPosition : "center",
    subImage: typeof data.subImage === "string" ? data.subImage : "",
    slides: data.slides.map((slide, index) => {
      if (!slide || typeof slide !== "object") {
        throw new Error(`slides[${index}] must be an object.`);
      }
      if (typeof slide.company !== "string" || !slide.company.trim()) {
        throw new Error(`slides[${index}].company must be a non-empty string.`);
      }
      return {
        company: slide.company.trim(),
        background: typeof slide.background === "string" ? slide.background : "",
        backgroundPosition: typeof slide.backgroundPosition === "string" ? slide.backgroundPosition : "",
        subImage: typeof slide.subImage === "string" ? slide.subImage : "",
        logo: typeof slide.logo === "string" ? slide.logo : "",
        logoSub: typeof slide.logoSub === "string" ? slide.logoSub : "",
        logoImage: typeof slide.logoImage === "string" ? slide.logoImage : "",
        deadline: typeof slide.deadline === "string" ? slide.deadline : "",
        salary: typeof slide.salary === "string" ? slide.salary : "",
        holiday: typeof slide.holiday === "string" ? slide.holiday : "",
        overtime: typeof slide.overtime === "string" ? slide.overtime : "",
        metricsNote: typeof slide.metricsNote === "string" ? slide.metricsNote : "",
        points: normalizeStringList(slide.points),
        fit: normalizeStringList(slide.fit),
        unfit: normalizeStringList(slide.unfit)
      };
    })
  };
}

function normalizeData(data) {
  if (!data || typeof data !== "object") {
    throw new Error("JSON root must be an object.");
  }

  if (!Array.isArray(data.slides) || data.slides.length === 0) {
    throw new Error("slides must be a non-empty array.");
  }

  return {
    handle: typeof data.handle === "string" ? data.handle : "",
    background: typeof data.background === "string" ? data.background : "",
    mode: data.mode === "dense" ? "dense" : "",
    slides: data.slides.map((slide, index) => {
      if (!slide || typeof slide !== "object") {
        throw new Error(`slides[${index}] must be an object.`);
      }
      if (!Array.isArray(slide.blocks) || slide.blocks.length === 0) {
        throw new Error(`slides[${index}].blocks must be a non-empty array.`);
      }
      return {
        kicker: typeof slide.kicker === "string" ? slide.kicker : "",
        swipe: slide.swipe === true,
        background: typeof slide.background === "string" ? slide.background : "",
        blocks: slide.blocks.map((block, blockIndex) => {
          if (!block || typeof block !== "object" || typeof block.text !== "string") {
            throw new Error(`slides[${index}].blocks[${blockIndex}].text must be a string.`);
          }
          return {
            text: block.text,
            em: block.em === true
          };
        })
      };
    })
  };
}

function renderPreview() {
  previewGrid.innerHTML = generatedFiles
    .map((file, index) => `<div class="mini" title="${escapeHtml(file.fileName)}">${file.preview}</div>`)
    .join("");

  slideSelect.innerHTML = generatedFiles
    .map((file, index) => `<option value="${index}">${escapeHtml(file.fileName)}</option>`)
    .join("");
}

function updateCurrentOutput() {
  if (!generatedFiles[currentIndex]) {
    htmlOutput.value = "";
    return;
  }
  slideSelect.value = String(currentIndex);
  htmlOutput.value = generatedFiles[currentIndex].html;
}

function setStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.classList.toggle("error", isError);
}

function setEnabled(enabled) {
  downloadZipButton.disabled = !enabled;
  downloadCurrentButton.disabled = !enabled;
  copyButton.disabled = !enabled;
  renderCurrentButton.disabled = !enabled;
  renderAllButton.disabled = !enabled;
  downloadPngZipButton.disabled = renderedImages.length === 0;
}

function renderDocument(data, slide, index) {
  const title = data.mode === "company"
    ? `${slide.company} / ${index + 1}`
    : `${index + 1}/${data.slides.length}`;
  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)}</title>
${renderSlideCss()}
</head>
<body>
${renderPost(data, slide, index)}
</body>
</html>
`;
}

function renderPost(data, slide, index) {
  if (data.mode === "company") {
    return renderCompanyPost(data, slide, index);
  }

  const background = getBackgroundForSlide(data, slide, index);
  const backgroundHtml = background
    ? `<img class="bg" src="${escapeAttr(background)}" alt="">`
    : `<div class="bg-fallback" aria-hidden="true"></div>`;
  const swipeHtml = slide.swipe ? `<div class="swipe">&larr; swipe &rarr;</div>` : "";
  const blocksHtml = slide.blocks
    .map(block => {
      const classes = block.em ? "bubble-text em" : "bubble-text";
      return `<div class="bubble"><span class="${classes}">${escapeLines(block.text)}</span></div>`;
    })
    .join("\n        ");

  const postClass = data.mode === "dense" ? "post dense" : "post";

  return `<article class="${postClass}">
  ${backgroundHtml}
  <div class="overlay"></div>
  <div class="content">
    <div class="story">
        ${blocksHtml}
    </div>
  </div>
  ${swipeHtml}
</article>`;
}

function renderCompanyPost(data, slide, index) {
  const background = getBackgroundForSlide(data, slide, index);
  const backgroundPosition = slide.backgroundPosition || data.backgroundPosition || "center";
  const backgroundHtml = background
    ? `<img class="company-bg" src="${escapeAttr(background)}" style="object-position:${escapeAttr(backgroundPosition)}" alt="">`
    : `<div class="company-bg-fallback" aria-hidden="true"></div>`;
  const subImage = slide.subImage || data.subImage || "";
  const subImageHtml = subImage
    ? `<img class="company-small-photo" src="${escapeAttr(subImage)}" alt="">`
    : "";
  const logoHtml = slide.logoImage
    ? `<img class="company-logo-image" src="${escapeAttr(slide.logoImage)}" alt="${escapeAttr(slide.company)}">`
    : `<div><div class="company-logo">${escapeHtml(slide.logo || slide.company)}</div>${slide.logoSub ? `<div class="company-logo-sub">${escapeHtml(slide.logoSub)}</div>` : ""}</div>`;
  const metrics = [
    slide.salary ? `年収：${slide.salary}` : "",
    slide.holiday ? `休日：${slide.holiday}` : "",
    slide.overtime ? `残業：${slide.overtime}` : ""
  ].filter(Boolean).join("｜");
  const pointsHtml = renderList(slide.points, "company-points");
  const fitHtml = renderParagraphList(slide.fit, "company-fit");
  const unfitHtml = renderParagraphList(slide.unfit, "company-fit");

  return `<article class="post company-post">
  ${backgroundHtml}
  <div class="company-bg-shade"></div>
  ${subImageHtml}
  <section class="company-card">
    <div class="company-logo-box">${logoHtml}</div>
    <div class="company-name">🏛️ ${escapeHtml(slide.company)}</div>
    ${slide.deadline ? `<div class="company-deadline">${escapeHtml(slide.deadline)}</div>` : ""}
    ${metrics ? `<div class="company-metrics">${escapeHtml(metrics)}</div>` : ""}
    ${slide.metricsNote ? `<div class="company-note">（${escapeHtml(slide.metricsNote)}）</div>` : ""}
    ${pointsHtml ? `<div class="company-section-title">深掘りポイント</div>${pointsHtml}` : ""}
    ${fitHtml ? `<div class="company-section-title">向いてる人</div>${fitHtml}` : ""}
    ${unfitHtml ? `<div class="company-section-title">向いてない人</div>${unfitHtml}` : ""}
  </section>
</article>`;
}

function renderList(items, className) {
  if (!items.length) {
    return "";
  }
  return `<ul class="${className}">${items.map(item => `<li>${escapeLines(item)}</li>`).join("")}</ul>`;
}

function renderParagraphList(items, className) {
  return items.map(item => `<p class="${className}">👉 ${escapeLines(item)}</p>`).join("");
}

function getBackgroundForSlide(data, slide, index) {
  return slideBackgroundDataUrls[index] || commonBackgroundDataUrl || slide.background || data.background || "";
}

async function handleCommonBackground(event) {
  try {
    commonBackgroundDataUrl = await readImageAsDataUrl(event.target.files[0]);
    generate();
    setStatus("Common background loaded");
  } catch (error) {
    event.target.value = "";
    setStatus(error.message, true);
  }
}

async function handleSlideBackground(event) {
  try {
    const targetIndex = currentIndex;
    slideBackgroundDataUrls[targetIndex] = await readImageAsDataUrl(event.target.files[0]);
    generate();
    currentIndex = Math.min(targetIndex, generatedFiles.length - 1);
    updateCurrentOutput();
    setStatus(`Background loaded for slide ${currentIndex + 1}`);
  } catch (error) {
    event.target.value = "";
    setStatus(error.message, true);
  }
}

function readImageAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file) {
      resolve("");
      return;
    }
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
      reject(new Error("Use PNG, JPG, WebP, or GIF images."));
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      reject(new Error("Image upload must be 5MB or smaller."));
      return;
    }
    const reader = new FileReader();
    reader.addEventListener("load", () => resolve(String(reader.result || "")), { once: true });
    reader.addEventListener("error", () => reject(new Error("Could not read image file.")), { once: true });
    reader.readAsDataURL(file);
  });
}

async function renderPng(index) {
  const file = generatedFiles[index];
  if (!file) {
    return;
  }

  setRenderButtons(false);
  setStatus(`Rendering ${file.pngName}...`);

  try {
    const result = await renderApi(file.html);
    const item = {
      index,
      fileName: file.pngName,
      html: file.html,
      url: result.url,
      createdAt: new Date().toLocaleString(),
      renderKb: result.render_kb || 0
    };
    upsertRenderedImage(item);
    renderRenderedImages();
    setStatus(`Rendered ${file.pngName}`);
  } catch (error) {
    setStatus(`${file.pngName}: ${error.message}`, true);
  } finally {
    setRenderButtons(true);
  }
}

async function renderAllPngs() {
  if (generatedFiles.length === 0) {
    return;
  }

  setRenderButtons(false);
  try {
    for (let index = 0; index < generatedFiles.length; index += 1) {
      const file = generatedFiles[index];
      setStatus(`Rendering ${index + 1}/${generatedFiles.length}: ${file.pngName}`);
      const result = await renderApi(file.html);
      upsertRenderedImage({
        index,
        fileName: file.pngName,
        html: file.html,
        url: result.url,
        createdAt: new Date().toLocaleString(),
        renderKb: result.render_kb || 0
      });
      renderRenderedImages();
    }
    setStatus(`Rendered ${generatedFiles.length} PNG(s)`);
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    setRenderButtons(true);
  }
}

async function renderApi(html) {
  const response = await fetch("/api/render", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      html,
      format: "png",
      width: 1080,
      height: 1920
    })
  });
  const text = await response.text();
  let json = {};
  try {
    json = text ? JSON.parse(text) : {};
  } catch {
    throw new Error(`/api/render returned non-JSON. HTTP ${response.status}`);
  }
  if (!response.ok || json.error) {
    throw new Error(json.error || `HTTP ${response.status}`);
  }
  return json;
}

function upsertRenderedImage(item) {
  renderedImages = renderedImages.filter(existing => existing.index !== item.index);
  renderedImages.push(item);
  renderedImages.sort((a, b) => a.index - b.index);
  downloadPngZipButton.disabled = renderedImages.length === 0;
}

function renderRenderedImages() {
  if (renderedImages.length === 0) {
    renderedGrid.innerHTML = "";
    downloadPngZipButton.disabled = true;
    return;
  }

  renderedGrid.innerHTML = renderedImages.map(item => {
    const downloadUrl = `/api/download-image?url=${encodeURIComponent(item.url)}&filename=${encodeURIComponent(item.fileName)}`;
    return `<article class="render-card">
      <img src="${escapeAttr(item.url)}" alt="${escapeAttr(item.fileName)}">
      <div class="render-meta">
        <div class="render-title">${escapeHtml(item.fileName)}</div>
        <div class="render-subtitle">${escapeHtml(item.createdAt)} / ${escapeHtml(item.renderKb)}KB HTML</div>
        <div class="render-actions">
          <button class="button secondary" type="button" data-render-index="${item.index}">Regenerate</button>
          <a class="button secondary" href="${escapeAttr(downloadUrl)}">Download</a>
        </div>
      </div>
    </article>`;
  }).join("");

  renderedGrid.querySelectorAll("[data-render-index]").forEach(button => {
    button.addEventListener("click", () => renderPng(Number(button.dataset.renderIndex)));
  });

  downloadPngZipButton.disabled = false;
}

async function downloadPngZip() {
  if (renderedImages.length === 0) {
    return;
  }

  setStatus("Preparing PNG ZIP...");
  const response = await fetch("/api/download-images-zip", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      filename: "carousel-images.zip",
      items: renderedImages.map(item => ({
        url: item.url,
        filename: item.fileName
      }))
    })
  });

  if (!response.ok) {
    const text = await response.text();
    let json = {};
    try {
      json = text ? JSON.parse(text) : {};
    } catch {
      // Ignore non-JSON ZIP errors.
    }
    setStatus(json.error || `PNG ZIP failed. HTTP ${response.status}`, true);
    return;
  }

  downloadBlob("carousel-images.zip", await response.blob());
  setStatus("Downloaded PNG ZIP");
}

function setRenderButtons(enabled) {
  renderCurrentButton.disabled = !enabled || generatedFiles.length === 0;
  renderAllButton.disabled = !enabled || generatedFiles.length === 0;
  downloadPngZipButton.disabled = !enabled || renderedImages.length === 0;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("`", "&#96;");
}

function escapeLines(value) {
  return escapeHtml(value).replace(/\r\n|\r|\n/g, "<br>");
}

function downloadZip() {
  const files = Object.fromEntries(generatedFiles.map(file => [file.fileName, file.html]));
  files["slides.json"] = jsonInput.value;
  files["README.txt"] = [
    "Open each slide_XX.html directly in a browser.",
    "Uploaded backgrounds are embedded as data URLs.",
    "Use the generator's Render current PNG / Render all PNGs buttons to create PNGs through MarkupGo."
  ].join("\n");
  downloadBlob("carousel-slides.zip", createZip(files));
}

function downloadBlob(fileName, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function createZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  const encoder = new TextEncoder();

  Object.entries(files).forEach(([name, content]) => {
    const nameBytes = encoder.encode(name);
    const dataBytes = encoder.encode(content);
    const crc = crc32(dataBytes);
    const localHeader = concatBytes(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(dataBytes.length), u32(dataBytes.length),
      u16(nameBytes.length), u16(0), nameBytes
    );
    localParts.push(localHeader, dataBytes);

    const centralHeader = concatBytes(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(dataBytes.length), u32(dataBytes.length),
      u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0),
      u32(offset), nameBytes
    );
    centralParts.push(centralHeader);
    offset += localHeader.length + dataBytes.length;
  });

  const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
  const endRecord = concatBytes(
    u32(0x06054b50), u16(0), u16(0), u16(Object.keys(files).length), u16(Object.keys(files).length),
    u32(centralSize), u32(offset), u16(0)
  );

  return new Blob([...localParts, ...centralParts, endRecord], { type: "application/zip" });
}

function u16(value) {
  const bytes = new Uint8Array(2);
  new DataView(bytes.buffer).setUint16(0, value, true);
  return bytes;
}

function u32(value) {
  const bytes = new Uint8Array(4);
  new DataView(bytes.buffer).setUint32(0, value >>> 0, true);
  return bytes;
}

function concatBytes(...parts) {
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const bytes = new Uint8Array(total);
  let offset = 0;
  parts.forEach(part => {
    bytes.set(part, offset);
    offset += part.length;
  });
  return bytes;
}

function crc32(bytes) {
  let crc = -1;
  for (let i = 0; i < bytes.length; i += 1) {
    crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
  }
  return (crc ^ -1) >>> 0;
}

const crcTable = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i += 1) {
    let value = i;
    for (let j = 0; j < 8; j += 1) {
      value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
    }
    table[i] = value >>> 0;
  }
  return table;
})();
